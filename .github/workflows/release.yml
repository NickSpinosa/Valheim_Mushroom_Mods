name: Build mod DLLs

# Builds every mod, attaches the DLLs to a release, and publishes each mod to
# Thunderstore. The build itself lives in .github/actions/build-mods, shared
# with the CI workflow so the two cannot drift; only the uploads are specific to
# releasing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag to attach the DLLs to. Leave blank to build only
          and leave the output as a workflow artifact.
        required: false
        default: ''
      publish_thunderstore:
        description: >-
          Also upload the per-mod packages to Thunderstore. A published release
          always does; this is for re-running the upload by hand.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    # Windows: the mods compose reference paths with backslashes, and steamcmd
    # needs no 32-bit shims here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-mods
        with:
          thunderstore-namespace: ${{ vars.THUNDERSTORE_NAMESPACE }}

      # The plugins zip is built by the composite action, so CI and releases ship
      # byte-identical packaging and CI proves the step still works.

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: mod-dlls
          path: MushroomMods-plugins.zip
          if-no-files-found: error

      # Kept even when nothing is published, so a failed or skipped upload can be
      # inspected, or done by hand with the same zips.
      - name: Upload Thunderstore packages
        uses: actions/upload-artifact@v4
        with:
          name: thunderstore-packages
          path: thunderstore-packages
          if-no-files-found: error

      - name: Attach the plugins folder to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag reaches the script through the environment rather than inline
          # interpolation, so a dispatch input cannot be read as PowerShell.
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG 'MushroomMods-plugins.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for tag '$env:RELEASE_TAG'" }

      # Each mod is its own Thunderstore package, versioned by its BepInPlugin
      # attribute. Versions Thunderstore already has are skipped, so a release
      # that touched one mod uploads one package. Needs the THUNDERSTORE_TOKEN
      # secret and THUNDERSTORE_NAMESPACE variable; without them the step
      # explains itself and the release still succeeds.
      - name: Publish to Thunderstore
        if: github.event_name == 'release' || inputs.publish_thunderstore
        shell: pwsh
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
          THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
        run: |
          if (-not $env:TCLI_AUTH_TOKEN -or -not $env:THUNDERSTORE_NAMESPACE) {
            Write-Host '::warning::Thunderstore publish skipped: set the THUNDERSTORE_TOKEN secret and THUNDERSTORE_NAMESPACE variable in the repository settings. See docs/devops.md.'
            exit 0
          }

          dotnet tool install -g tcli
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the Thunderstore CLI.' }

          & .github/scripts/Publish-ThunderstorePackages.ps1 -PackagesDir thunderstore-packages
