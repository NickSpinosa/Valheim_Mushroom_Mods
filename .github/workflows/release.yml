name: Build mod DLLs

# Builds every mod and attaches the DLLs to a release. The build itself lives in
# .github/actions/build-mods, shared with the CI workflow so the two cannot
# drift; only the upload is specific to releasing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag to attach the DLLs to. Leave blank to build only
          and leave the output as a workflow artifact.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    # Windows: the mods compose reference paths with backslashes, and steamcmd
    # needs no 32-bit shims here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-mods

      # The plugins zip is built by the composite action, so CI and releases ship
      # byte-identical packaging and CI proves the step still works.

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: mod-dlls
          path: MushroomMods-plugins.zip
          if-no-files-found: error

      - name: Attach the plugins folder to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag reaches the script through the environment rather than inline
          # interpolation, so a dispatch input cannot be read as PowerShell.
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG 'MushroomMods-plugins.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for tag '$env:RELEASE_TAG'" }
