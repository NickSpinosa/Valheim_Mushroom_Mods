name: CI

# Compile check on every push and pull request. Shares the build logic with the
# release workflow via .github/actions/build-mods, so the two cannot drift.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  # To leave the "build ready to test" comment on a pull request.
  pull-requests: write

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows: the mods compose reference paths with backslashes, and steamcmd
    # needs no 32-bit shims here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-mods

      # The same zip a release ships, so testing a PR build is the same motion as
      # installing a release: extract it into BepInEx/.
      - name: Upload build output
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: mod-plugins-${{ github.sha }}
          path: MushroomMods-plugins.zip
          if-no-files-found: error
          retention-days: 14

      # Artifacts are otherwise buried in the Actions run, which is a lot of
      # clicking for a reviewer who just wants to try the build.
      #
      # The previous comment is deleted and a new one posted, rather than edited in
      # place. GitHub anchors an edited comment at its original position, so on a PR
      # with later commits it sits above them looking like it describes an older
      # build. Deleting and reposting keeps exactly one comment and keeps it at the
      # bottom, where the latest build belongs.
      #
      # Skipped for pull requests from forks: those runs get a read-only token, so
      # commenting would fail the job rather than the build actually being broken.
      - name: Link the build on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          # Hidden marker so we find our own comment rather than whichever comment
          # the bot happened to post last - another workflow commenting would
          # otherwise make us clobber it.
          $marker = '<!-- mushroom-build-link -->'
          $short = $env:COMMIT.Substring(0, 7)

          $body = @(
            $marker,
            '### Build ready to test',
            '',
            "[**MushroomMods-plugins.zip**]($env:ARTIFACT_URL) - built from ``$short``.",
            '',
            'Download and extract it, then drop the `plugins` folder into your Valheim',
            '`BepInEx/` directory - on every client and on the dedicated server. It is the',
            'same package a release ships.',
            '',
            'GitHub wraps artifacts in a zip of their own, so there are two layers to',
            'unpack. Expires in 14 days.',
            '',
            '<sub>Reposted on each push, so this always describes the latest commit.</sub>'
          ) -join "`n"

          # Matching is done here rather than with --jq: the marker contains spaces
          # and a leading "--", which the shell reads as a flag when it is embedded
          # in a jq expression passed to gh.
          $raw = gh api "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Could not list pull request comments.' }

          $comments = @()
          foreach ($page in ($raw | ConvertFrom-Json)) { $comments += $page }

          $stale = @($comments | Where-Object { $_.body -and $_.body.StartsWith($marker) })
          foreach ($comment in $stale) {
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/issues/comments/$($comment.id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "Could not delete comment $($comment.id); leaving it." }
            else { Write-Host "Removed previous build comment $($comment.id)." }
          }

          gh pr comment $env:PR_NUMBER --body $body
          if ($LASTEXITCODE -ne 0) { throw 'Could not comment on the pull request.' }
